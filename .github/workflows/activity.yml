name: Update Latest Activity

on:
  schedule:
    - cron: "17 11 * * *"       # 11:17 UTC — off-peak minute per G3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render activity block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: ${{ github.repository_owner }}
        run: python scripts/update_activity.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No activity changes."
          else
            git commit -m "chore: refresh activity block"
            git push
          fi
